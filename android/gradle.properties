org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8

# Build output and native staging live outside the synced project folder.
warcraftai.workDir=D:/WarcraftAI-work
warcraftai.abis=armeabi-v7a,arm64-v8a
# Stratagus through the D:\w junction, which keeps build command lines short.
warcraftai.engineDir=D:/w/engine/stratagus
# Windows tolua++ built from engine/stratagus/third-party/lua-5.1.5.
warcraftai.hostToluapp=D:/WarcraftAI-work/build/host-tolua/Release/toluapp.exe
