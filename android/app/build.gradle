plugins {
    id 'com.android.application'
}

def workDir = providers.gradleProperty('warcraftai.workDir').get()
def hostToluapp = providers.gradleProperty('warcraftai.hostToluapp').get()
def engineDir = providers.gradleProperty('warcraftai.engineDir').get()
def sdlJava = file('../../engine/stratagus/third-party/SDL/android-project/app/src/main/java')

layout.buildDirectory.set(file("${workDir}/build/gradle/app"))

def bundleData = providers.gradleProperty('warcraftai.bundleData').orNull
def offlineAssets = file("${workDir}/build/offline-assets")
// Only the extractor needs the original installer.
def dataExcludes = ['install.exe']

android {
    namespace 'com.vaclav.wargusport'
    compileSdk 37
    ndkVersion '28.2.13676358'

    defaultConfig {
        applicationId 'com.vaclav.wargusport'
        minSdk 23
        // SDL 2.0.22 registers broadcast receivers without the export flag
        // that Android 14 requires once an app targets API 34 or higher.
        targetSdk 33
        versionCode 2
        versionName '1.0'

        ndk {
            // Override with -Pwarcraftai.abis=x86_64 for an emulator build.
            abiFilters(*providers.gradleProperty('warcraftai.abis').get().split(','))
        }

        externalNativeBuild {
            cmake {
                targets 'main'
                arguments '-DANDROID_STL=c++_static',
                          "-DSTRATAGUS_HOST_TOLUAPP=${hostToluapp}",
                          "-DENGINE_DIR=${engineDir}"
            }
        }
    }

    sourceSets {
        main {
            java.srcDirs += sdlJava
        }
    }

    externalNativeBuild {
        cmake {
            path file('src/main/cpp/CMakeLists.txt')
            version '3.31.6'
            buildStagingDirectory file("${workDir}/build/cxx")
        }
    }

    // Offline build: -Pwarcraftai.bundleData=<data.Wargus folder> packs the game
    // data into the APK, unpacked on first launch by SetupActivity. Such an APK
    // holds Blizzard's files, so it must never be published.
    // The folder is always an asset source, emptied for normal builds, so
    // Gradle sees the data leave and a normal APK never keeps it.
    sourceSets.main.assets.srcDirs += offlineAssets
    androidResources {
        // data.zip is already compressed.
        noCompress 'zip'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError false
    }
}

if (bundleData != null) {
    def packData = tasks.register('packOfflineData', Zip) {
        from(bundleData) { exclude dataExcludes }
        destinationDirectory = offlineAssets
        archiveFileName = 'data.zip'
        doLast {
            long size = 0
            fileTree(bundleData) { exclude dataExcludes }.each { size += it.length() }
            new File(offlineAssets, 'data.size').text = "${size}\n"
        }
    }
    // Debug packaging updates the APK in place, which leaves dead space
    // behind when hundreds of MB change, so an offline APK is always fresh.
    def freshApk = tasks.register('freshOfflineApk', Delete) {
        delete layout.buildDirectory.dir('outputs/apk')
        delete layout.buildDirectory.dir('intermediates/incremental')
    }
    tasks.named('preBuild') { dependsOn packData, freshApk }
} else {
    // Coming from an offline build, also drop the APK: debug packaging
    // updates it in place and would keep the removed data as dead space.
    def leftover = new File(offlineAssets, 'data.zip').exists()
    def clearData = tasks.register('clearOfflineData', Delete) {
        delete fileTree(offlineAssets)
        if (leftover) {
            delete layout.buildDirectory.dir('outputs/apk')
            delete layout.buildDirectory.dir('intermediates/incremental')
        }
    }
    tasks.named('preBuild') { dependsOn clearData }
}
